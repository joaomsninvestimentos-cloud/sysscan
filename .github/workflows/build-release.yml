name: Build e Publicar Release

# Dispara automaticamente quando você criar uma tag "v..." no GitHub.
# Ex.: git tag v3.0 && git push origin v3.0
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout do código
        uses: actions/checkout@v5

      - name: Configurar JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Android SDK
        run: |
          SDK_DIR="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK_DIR" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_DIR" >> "$GITHUB_ENV"
          echo "$SDK_DIR/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$SDK_DIR/cmdline-tools/bin" >> "$GITHUB_PATH"
          echo "$SDK_DIR/platform-tools" >> "$GITHUB_PATH"
          echo "SDK em $SDK_DIR"
          ls -la "$SDK_DIR" || true
          ls -la "$SDK_DIR/cmdline-tools" || true

      - name: Instalar build-tools e platform
        run: |
          SDKMANAGER=""
          for candidate in \
            "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "$ANDROID_HOME/cmdline-tools/bin/sdkmanager" \
            "$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f 2>/dev/null | head -1)"; do
            if [ -x "$candidate" ]; then
              SDKMANAGER="$candidate"
              break
            fi
          done
          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager nao encontrado, usando o preinstalado no runner"
            SDKMANAGER="$(command -v sdkmanager || true)"
          fi
          echo "Usando $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          yes | "$SDKMANAGER" "platforms;android-34" "build-tools;34.0.0"

      - name: Restaurar keystore de release
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | tr -d ' \r\n' | base64 -d > release.keystore
          chmod 600 release.keystore

      - name: Tornar gradlew executável
        run: chmod +x gradlew

      - name: Compilar APK de release
        run: ./gradlew assembleRelease --no-daemon

      - name: Assinar APK
        run: |
          mkdir -p dist
          $ANDROID_HOME/build-tools/34.0.0/zipalign -f 4 \
            app/build/outputs/apk/release/app-release-unsigned.apk dist/app-aligned.apk
          $ANDROID_HOME/build-tools/34.0.0/apksigner sign \
            --ks release.keystore \
            --ks-key-alias sysscan \
            --ks-pass pass:$(echo "${{ secrets.KEYSTORE_PASSWORD }}" | tr -d ' \r\n') \
            --key-pass pass:$(echo "${{ secrets.KEYSTORE_PASSWORD }}" | tr -d ' \r\n') \
            --out dist/SysScan.apk dist/app-aligned.apk

      - name: Publicar release no GitHub
        uses: softprops/action-gh-release@v2
        with:
          files: dist/SysScan.apk
          generate_release_notes: true
